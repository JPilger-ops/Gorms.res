name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ADMIN_ALLOWED_HOSTS: login.gorms.de
      ADMIN_APP_URL: https://login.gorms.de
      ADMIN_HOST: login.gorms.de
      NEXT_PUBLIC_SITE_URL: https://xn--heideknig-57a.gorms.de
      PUBLIC_ALLOWED_HOSTS: heidekönig.gorms.de,xn--heideknig-57a.gorms.de
      PUBLIC_HOST: xn--heideknig-57a.gorms.de
      RUN_MIGRATIONS_ON_START: "false"
      SESSION_SECRET: ci-session-secret-that-is-not-used-in-production
      SETUP_TOKEN: ci-setup-token-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
